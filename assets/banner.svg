<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="0.55" stop-color="#241541"/>
      <stop offset="1" stop-color="#160b28"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="usbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2a63"/>
      <stop offset="1" stop-color="#1e1236"/>
    </linearGradient>
    <linearGradient id="usbMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2d9f5"/>
      <stop offset="0.5" stop-color="#9d8cc9"/>
      <stop offset="1" stop-color="#d9d0f0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="960" cy="90" r="260" fill="url(#glow1)"/>
  <circle cx="1000" cy="260" r="180" fill="url(#glow2)"/>

  <!-- starfield -->
  <circle cx="120" cy="50" r="1.6" fill="#e9e4ff" opacity="0.8"/>
  <circle cx="220" cy="90" r="1.2" fill="#e9e4ff" opacity="0.6"/>
  <circle cx="340" cy="40" r="1.8" fill="#e9e4ff" opacity="0.7"/>
  <circle cx="500" cy="70" r="1.3" fill="#e9e4ff" opacity="0.5"/>
  <circle cx="80" cy="200" r="1.4" fill="#e9e4ff" opacity="0.6"/>
  <circle cx="700" cy="45" r="1.5" fill="#e9e4ff" opacity="0.6"/>
  <circle cx="150" cy="300" r="1.3" fill="#e9e4ff" opacity="0.5"/>
  <circle cx="620" cy="310" r="1.6" fill="#e9e4ff" opacity="0.6"/>
  <circle cx="1080" cy="60" r="1.6" fill="#fff" opacity="0.8"/>
  <circle cx="1140" cy="180" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="1050" cy="320" r="1.4" fill="#fff" opacity="0.6"/>

  <!-- orbit rings around device -->
  <g opacity="0.5">
    <ellipse cx="960" cy="185" rx="190" ry="70" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <ellipse cx="960" cy="185" rx="140" ry="140" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- orbiting small planets -->
  <circle cx="1150" cy="150" r="6" fill="url(#orbGrad)"/>
  <circle cx="770" cy="150" r="4" fill="#facc15" opacity="0.9"/>
  <circle cx="960" cy="45" r="5" fill="#c4b5fd" opacity="0.9"/>

  <!-- USB portable drive icon -->
  <g transform="translate(870,150)">
    <rect x="0" y="0" width="180" height="70" rx="14" fill="url(#usbBody)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="8" y="8" width="164" height="54" rx="10" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <rect x="-26" y="20" width="30" height="30" rx="4" fill="url(#usbMetal)"/>
    <rect x="-30" y="28" width="8" height="14" fill="#c4b5fd"/>
    <circle cx="90" cy="35" r="16" fill="none" stroke="#facc15" stroke-width="2.5"/>
    <circle cx="90" cy="35" r="4" fill="#facc15"/>
    <circle cx="140" cy="35" r="3.5" fill="#7c3aed"/>
    <circle cx="30" cy="35" r="3.5" fill="#7c3aed"/>
  </g>

  <!-- subtle circuit lines lower right -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.35">
    <path d="M 780 300 L 830 300 L 830 270 L 880 270"/>
    <path d="M 900 320 L 900 290 L 960 290 L 960 250"/>
    <circle cx="830" cy="270" r="3" fill="#7c3aed"/>
    <circle cx="960" cy="250" r="3" fill="#7c3aed"/>
  </g>

  <!-- Headline -->
  <text x="60" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="700" fill="url(#titleGrad)" textLength="720" lengthAdjust="spacingAndGlyphs">GOG Galaxy Portable</text>

  <!-- Tagline -->
  <text x="62" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#d7cff5" textLength="720" lengthAdjust="spacingAndGlyphs">Runs GOG Galaxy with built-in portability —</text>
  <text x="62" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#d7cff5" textLength="640" lengthAdjust="spacingAndGlyphs">single binary, no installation required</text>

  <!-- accent underline -->
  <rect x="62" y="270" width="120" height="4" rx="2" fill="#facc15"/>
</svg>